<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전산직 합격 루틴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: planner column — phase header, D-day strip, today's time-blocked checklist, week summary, multi-year roadmap */
:root{
  --bg:#f2f3f7; --panel:#ffffff; --fg:#161a2b; --muted:#5e6478; --line:#dadde8;
  --accent:#2e47b5; --accent-soft:#e3e8fb; --mark:#fff1a8; --mark-fg:#5c4a00; --warn:#b4532a; --track:#e6e8f0;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --panel:#171b2c; --fg:#e6e8f2; --muted:#9298ae; --line:#272c42;
  --accent:#8ea2ff; --accent-soft:#22294a; --mark:#4a4214; --mark-fg:#f3e39a; --warn:#e48a5e; --track:#232840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --panel:#171b2c; --fg:#e6e8f2; --muted:#9298ae; --line:#272c42;
  --accent:#8ea2ff; --accent-soft:#22294a; --mark:#4a4214; --mark-fg:#f3e39a; --warn:#e48a5e; --track:#232840; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-family:var(--mono);font-weight:500}
.meta{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phase-tag{display:inline-block;font-family:var(--mono);font-size:.78rem;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;margin-top:6px}
.streak{text-align:right;font-family:var(--mono);font-size:.82rem}
.streak b{display:block;font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,input,select{font:inherit}
button{font-family:var(--mono);font-size:.82rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
a{color:var(--accent)}

/* D-day strip */
.ddays{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.dd{flex:0 0 auto;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:2px;position:relative}
.dd b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.dd.past b{color:var(--muted)}
.dd .nm{font-size:.85rem;font-weight:500}
.dd .x{position:absolute;top:4px;right:4px;padding:0 6px;font-size:.7rem;border:0;background:transparent;color:var(--muted)}
form.ddadd{display:flex;gap:6px;flex-wrap:wrap}
form.ddadd input[type=text]{flex:1 1 140px}

/* today */
.progress{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.slot{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.blk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.blk + .blk{margin-top:6px}
.blk input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.blk .t{min-width:0}
.blk .task{font-weight:500;overflow-wrap:anywhere}
.blk .sub{font-family:var(--mono);font-size:.72rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:6px;white-space:nowrap}
.blk.done{background:var(--mark)}
.blk.done .task{color:var(--mark-fg);text-decoration:line-through;text-decoration-thickness:1px}
.blk.done .sub{color:var(--mark-fg);border-color:transparent}
.blk .min{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.blk .go{font-size:.78rem;margin-left:6px}
.edit-row{display:grid;grid-template-columns:80px 110px minmax(0,1fr) 64px auto;gap:6px;align-items:center}
.edit-row + .edit-row{margin-top:6px}
.edit-row input,.edit-row select{width:100%}
.memo{display:flex;gap:8px}
.memo input{flex:1}
.empty{color:var(--muted);font-size:.9rem}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wd .bar{width:100%;max-width:34px;background:var(--track);border-radius:4px 4px 0 0;position:relative;flex:1;display:flex;align-items:flex-end;overflow:hidden}
.wd .bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.wd .lb{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.wd.today .lb{color:var(--fg);font-weight:600}
.wd .v{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.subs{display:flex;flex-direction:column;gap:6px}
.sr{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.88rem}
.sr .track{height:6px}
.sr .meta{text-align:right}

/* roadmap */
.road{display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.ph:last-child{padding-bottom:0}
.ph::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.ph:last-child::before{display:none}
.ph .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--panel);margin-top:2px;position:relative;z-index:1}
.ph.past .dot{background:var(--line)}
.ph.now .dot{border-color:var(--accent);background:var(--accent)}
.ph .pn{font-weight:600}
.ph.now .pn{color:var(--accent)}
.ph ul{margin:4px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.ph.past{opacity:.6}
.note{font-size:.82rem;color:var(--muted);margin:0}
@media (max-width:560px){
  .edit-row{grid-template-columns:1fr 1fr;}
  .edit-row .task-in{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <div class="meta" id="date"></div>
      <h1>전산직 합격 루틴</h1>
      <span class="phase-tag" id="phaseTag"></span>
    </div>
    <div class="streak">루틴 연속<b id="streak">0</b>일</div>
  </header>

  <section class="card">
    <div class="head"><h2>디데이</h2><button class="ghost" id="ddToggle">+ 일정 추가</button></div>
    <div class="ddays" id="ddays"></div>
    <form class="ddadd" id="ddForm" hidden>
      <input type="text" id="ddName" placeholder="일정 이름 (예: 토익 시험)" required>
      <input type="date" id="ddDate" required>
      <button class="primary" type="submit">추가</button>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <h2>오늘 루틴</h2>
      <div style="display:flex;gap:6px"><button id="editBtn">루틴 편집</button></div>
    </div>
    <div class="progress">
      <div class="head"><span id="progText" style="font-weight:600"></span><span class="meta" id="progMin"></span></div>
      <div class="track"><i id="progBar" style="width:0"></i></div>
    </div>
    <div id="blocks"></div>
    <div class="memo"><input id="memo" placeholder="오늘 한 줄 회고 (예: 컴일 OS 스케줄링 계산이 헷갈림)" aria-label="오늘 한 줄 회고"></div>
  </section>

  <section class="card">
    <div class="head"><h2>이번 주</h2><span class="meta" id="weekTotal"></span></div>
    <div class="week" id="week"></div>
    <div class="subs" id="subs"></div>
  </section>

  <section class="card">
    <div class="head"><h2>단계별 로드맵</h2><span class="meta">2026.11 → 2030.08</span></div>
    <div class="road" id="road"></div>
    <p class="note">단계가 바뀌는 날이 되면 오늘 루틴도 그 단계의 기본 루틴으로 자동으로 바뀌어요. 단계마다 편집한 내용은 따로 저장돼요. 기록은 이 브라우저에만 남아요.</p>
  </section>
</div>

<script>
const ENGLISH_URL="https://chaehyun05.github.io/english/";
const SUBJECTS=["영어","국어","컴퓨터일반","정보보호론","한국사","토익","자격증","복습","기타"];
const SLOTS=["아침","오후","저녁"];
const PHASES=[
 {id:"p0",name:"기초 다지기",period:"2026.11 – 2027.02",start:"2026-11-01",end:"2027-02-28",
  focus:["한능검 3급 (제82회, 2/13)","토익 470+ 기초","컴퓨터일반 전공 복습","영어 기초 문법·단어"],
  blocks:[["아침","영어","영어 할당량 채우기 (단어·문법·쉐도잉)",40,1],["아침","한국사","한능검 강의 1강 + 핵심 요약",60],
          ["오후","컴퓨터일반","전공 복습 1단원 (자료구조·OS·네트워크 순)",60],["오후","토익","토익 LC 1파트 + 단어 30개",30],
          ["저녁","한국사","오늘 들은 강의 기출 20문제",30],["저녁","복습","오늘 공부한 것 10분 훑어보기",10]]},
 {id:"p1",name:"해외봉사 중 유지",period:"2027.03 – 2027.07",start:"2027-03-01",end:"2027-07-31",
  focus:["영어 단어 하루 30분 유지","현지에서 영어로 말해 보기"],
  blocks:[["아침","영어","영어 단어 30분",30],["저녁","영어","영어 페이지 쉐도잉·리스닝",20,1]]},
 {id:"p2",name:"Hy-Po · 기본강의",period:"2027.08 – 2028.02",start:"2027-08-01",end:"2028-02-29",
  focus:["국어 기본강의","영어 기본강의","컴퓨터일반 기본강의"],
  blocks:[["아침","영어","공무원 영어 단어",30],["아침","국어","국어 기본강의 1강",60],
          ["오후","영어","영어 기본강의 1강 (문법·독해)",60],["저녁","컴퓨터일반","컴일 기본강의 1강",60],["저녁","복습","오늘 강의 복습",20]]},
 {id:"p3",name:"복학 · 정처기 · 정보보호론",period:"2028.03 – 2028.07",start:"2028-03-01",end:"2028-07-31",
  focus:["정보보호론 기본강의","컴퓨터일반 기출 1회독","정보처리기사 취득 (가산점 5%)"],
  blocks:[["아침","영어","공무원 영어 단어",30],["아침","국어","국어 문법·독해 20문제",30],
          ["오후","정보보호론","정보보호론 기본강의 1강",60],["오후","컴퓨터일반","컴일 기출 1단원",60],["저녁","자격증","정처기 필기·실기 기출",60]]},
 {id:"p4",name:"코이카 · 기출 회독",period:"2028.08 – 2029.02",start:"2028-08-01",end:"2029-02-28",
  focus:["전 과목 기출 회독","국어·영어 점수 끌어올리기"],
  blocks:[["아침","영어","영어 단어 + 독해 기출 10문제",50],["아침","국어","국어 기출 25문항",50],
          ["오후","컴퓨터일반","컴일 기출 회독",60],["저녁","정보보호론","정보보호론 기출 회독",60],["저녁","복습","오답 노트 정리",20]]},
 {id:"p5",name:"싸피 · 실전 응시",period:"2029.03 – 2029.12",start:"2029-03-01",end:"2029-12-31",
  focus:["국가직 9급 (3월)","지방직 9급 (6월)","군무원 (7월)","하반기 정보보안기사"],
  blocks:[["아침","영어","영어 단어 + 하프 모의고사",40],["아침","국어","국어 하프 모의고사",30],
          ["저녁","컴퓨터일반","컴일 약점 단원 기출",40],["저녁","정보보호론","정보보호론 약점 단원 기출",40],["저녁","복습","오답 노트 10분",10]]},
 {id:"p6",name:"마지막 학기 · 본시험",period:"2030.01 – 2030.08",start:"2030-01-01",end:"2030-08-31",
  focus:["9급 본시험 응시","대기업 상반기 공채 병행","6월 진로 결정 → 8월 졸업"],
  blocks:[["아침","영어","실전 모의고사 1회 (4과목 100문항, 주 2회)",100],["오후","기타","대기업 코딩테스트 1문제",60],["저녁","복습","오답 노트 회독",30]]}
];

/* state */
const KEY="gongsi-routine-v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={};
S.routines=S.routines||{};S.days=S.days||{};
S.ddays=S.ddays||[{n:"한능검 82회 접수 시작",d:"2027-01-12"},{n:"한능검 82회 시험",d:"2027-02-13"},{n:"한능검 성적 발표",d:"2027-02-26"}];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TODAY=ymd(new Date());
const phaseOf=k=>PHASES.find(p=>k>=p.start&&k<=p.end)||(k<PHASES[0].start?PHASES[0]:PHASES[PHASES.length-1]);
let uid=0;const nid=()=>"b"+Date.now().toString(36)+(uid++);
function routine(p){if(!S.routines[p.id])S.routines[p.id]=p.blocks.map((b,i)=>({id:p.id+"-"+i,slot:b[0],sub:b[1],task:b[2],min:b[3],link:!!b[4]}));return S.routines[p.id]}
function day(k){return S.days[k]||(S.days[k]={done:{},memo:""})}
// a day's record keeps a snapshot of planned/done minutes so past days stay correct after edits
function snapshot(k){const p=phaseOf(k),r=routine(p),d=day(k);
  d.plan=r.reduce((a,b)=>a+(+b.min||0),0);
  d.doneMin=r.filter(b=>d.done[b.id]).reduce((a,b)=>a+(+b.min||0),0);
  d.bySub={};r.filter(b=>d.done[b.id]).forEach(b=>d.bySub[b.sub]=(d.bySub[b.sub]||0)+(+b.min||0));}
const rate=k=>{const d=S.days[k];return d&&d.plan?d.doneMin/d.plan:0};
function streak(){let n=0,dt=new Date();if(rate(ymd(dt))<.8)dt.setDate(dt.getDate()-1);while(rate(ymd(dt))>=.8){n++;dt.setDate(dt.getDate()-1)}return n}
const fmtMin=m=>m>=60?`${Math.floor(m/60)}시간${m%60?" "+m%60+"분":""}`:`${m}분`;

/* d-day */
function dd(dateStr){const a=new Date(TODAY+"T00:00:00"),b=new Date(dateStr+"T00:00:00");return Math.round((b-a)/864e5)}
function renderD(){const list=[...S.ddays].map((x,i)=>({...x,i})).sort((a,b)=>a.d.localeCompare(b.d));
  document.getElementById("ddays").innerHTML=list.length?list.map(x=>{const n=dd(x.d);
    return `<div class="dd${n<0?" past":""}"><button class="x" data-ddel="${x.i}" aria-label="${esc(x.n)} 삭제">×</button><b>${n===0?"D-DAY":n>0?"D-"+n:"D+"+(-n)}</b><span class="nm">${esc(x.n)}</span><span class="meta">${x.d.replace(/-/g,".")}</span></div>`}).join("")
    :`<span class="empty">시험 일정을 추가해 보세요.</span>`}
document.getElementById("ddToggle").onclick=()=>{const f=document.getElementById("ddForm");f.hidden=!f.hidden;if(!f.hidden)ddName.focus()};
document.getElementById("ddForm").addEventListener("submit",e=>{e.preventDefault();S.ddays.push({n:ddName.value.trim(),d:ddDate.value});ddName.value="";ddDate.value="";save();renderD()});
document.getElementById("ddays").addEventListener("click",e=>{const b=e.target.closest("[data-ddel]");if(!b)return;S.ddays.splice(+b.dataset.ddel,1);save();renderD()});

/* today */
let editing=false;
function renderToday(){
  const p=phaseOf(TODAY),r=routine(p),d=day(TODAY);snapshot(TODAY);save();
  document.getElementById("date").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  document.getElementById("phaseTag").textContent=`지금 단계 · ${p.name} (${p.period})`;
  document.getElementById("streak").textContent=streak();
  const pct=d.plan?Math.round(d.doneMin/d.plan*100):0;
  document.getElementById("progText").textContent=pct>=100?"오늘 루틴 완료":`${pct}% 진행`;
  document.getElementById("progMin").textContent=`${fmtMin(d.doneMin)} / ${fmtMin(d.plan)}`;
  document.getElementById("progBar").style.width=Math.min(100,pct)+"%";
  document.getElementById("editBtn").textContent=editing?"편집 끝내기":"루틴 편집";
  const box=document.getElementById("blocks");
  if(editing){
    box.innerHTML=r.map((b,i)=>`<div class="edit-row" data-i="${i}">
      <select id="es${i}" data-f="slot" aria-label="시간대">${SLOTS.map(s=>`<option${s===b.slot?" selected":""}>${s}</option>`).join("")}</select>
      <select id="eb${i}" data-f="sub" aria-label="과목">${SUBJECTS.map(s=>`<option${s===b.sub?" selected":""}>${s}</option>`).join("")}</select>
      <input id="et${i}" class="task-in" data-f="task" value="${esc(b.task)}" aria-label="할 일">
      <input id="em${i}" data-f="min" type="number" min="0" step="5" inputmode="numeric" value="${b.min}" aria-label="분">
      <button data-rm="${i}" aria-label="삭제">삭제</button></div>`).join("")+
      `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="primary" id="addBlk">+ 블록 추가</button><button id="resetBlk">이 단계 기본 루틴으로 되돌리기</button></div>
       <p class="note" id="resetNote" hidden style="margin-top:8px">한 번 더 누르면 기본 루틴으로 바뀌어요.</p>`;
  }else{
    box.innerHTML=r.length?SLOTS.map(s=>{const bs=r.filter(b=>b.slot===s);if(!bs.length)return "";
      return `<div class="slot">${s}</div>`+bs.map(b=>{const on=!!d.done[b.id];
        return `<label class="blk${on?" done":""}"><input type="checkbox" data-id="${b.id}"${on?" checked":""}>
          <span class="t"><span class="sub">${esc(b.sub)}</span><span class="task">${esc(b.task)}</span>${b.link?` <a class="go" href="${ENGLISH_URL}" target="_blank" rel="noopener">영어 페이지 열기 ↗</a>`:""}</span>
          <span class="min">${b.min}분</span></label>`}).join("")}).join("")
      :`<p class="empty">루틴이 비어 있어요. 루틴 편집에서 블록을 추가해 주세요.</p>`;
  }
  const m=document.getElementById("memo");if(document.activeElement!==m)m.value=d.memo||"";
}
document.getElementById("blocks").addEventListener("change",e=>{
  const t=e.target,p=phaseOf(TODAY),r=routine(p);
  if(t.type==="checkbox"){const d=day(TODAY);if(t.checked)d.done[t.dataset.id]=true;else delete d.done[t.dataset.id];save();renderAll();return}
  const row=t.closest(".edit-row");if(!row)return;const b=r[+row.dataset.i],f=t.dataset.f;
  b[f]=f==="min"?Math.max(0,parseInt(t.value)||0):t.value;save();renderToday();renderWeek();
});
let resetArmed=false;
document.getElementById("blocks").addEventListener("click",e=>{
  const p=phaseOf(TODAY),r=routine(p);
  const rm=e.target.closest("[data-rm]");if(rm){r.splice(+rm.dataset.rm,1);save();renderToday();renderWeek();return}
  if(e.target.id==="addBlk"){r.push({id:nid(),slot:"저녁",sub:"복습",task:"새 할 일",min:30});save();renderToday();const last=document.getElementById("et"+(r.length-1));if(last){last.focus();last.select()}return}
  if(e.target.id==="resetBlk"){if(!resetArmed){resetArmed=true;document.getElementById("resetNote").hidden=false;setTimeout(()=>{resetArmed=false},4000);return}
    resetArmed=false;delete S.routines[p.id];save();renderAll()}
});
document.getElementById("editBtn").onclick=()=>{editing=!editing;renderToday()};
document.getElementById("memo").addEventListener("input",e=>{day(TODAY).memo=e.target.value;save()});

/* week */
function renderWeek(){
  const now=new Date(TODAY+"T00:00:00"),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return ymd(d)});
  const recs=days.map(k=>S.days[k]||{});
  const max=Math.max(60,...recs.map(r=>Math.max(r.plan||0,r.doneMin||0)));
  const lbl=["월","화","수","목","금","토","일"];
  document.getElementById("week").innerHTML=days.map((k,i)=>{const r=recs[i],v=r.doneMin||0;
    return `<div class="wd${k===TODAY?" today":""}" title="${k} · ${fmtMin(v)}"><span class="v">${v?Math.round(v/6)/10+"h":""}</span><div class="bar"><i style="height:${v/max*100}%"></i></div><span class="lb">${lbl[i]}</span></div>`}).join("");
  const tot=recs.reduce((a,r)=>a+(r.doneMin||0),0);
  document.getElementById("weekTotal").textContent=`합계 ${fmtMin(tot)}`;
  const bySub={};recs.forEach(r=>Object.entries(r.bySub||{}).forEach(([s,m])=>bySub[s]=(bySub[s]||0)+m));
  const arr=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);const top=arr.length?arr[0][1]:1;
  document.getElementById("subs").innerHTML=arr.length?arr.map(([s,m])=>`<div class="sr"><span>${esc(s)}</span><div class="track"><i style="width:${m/top*100}%"></i></div><span class="meta">${fmtMin(m)}</span></div>`).join("")
    :`<p class="empty">이번 주에 체크한 블록이 아직 없어요. 오늘 루틴을 하나씩 체크하면 과목별 시간이 여기에 쌓여요.</p>`;
}

/* roadmap */
function renderRoad(){const cur=phaseOf(TODAY);
  document.getElementById("road").innerHTML=PHASES.map(p=>{const st=p.id===cur.id?"now":p.end<TODAY?"past":"";
    return `<div class="ph ${st}"><span class="dot"></span><div><div class="head" style="gap:6px"><span class="pn">${esc(p.name)}</span><span class="meta">${p.period}${st==="now"?" · 지금":""}</span></div><ul>${p.focus.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div></div>`}).join("")}

function renderAll(){renderToday();renderWeek();renderRoad();renderD()}
setInterval(()=>{const t=ymd(new Date());if(t!==TODAY){TODAY=t;renderAll()}},60000);
renderAll();
</script>
